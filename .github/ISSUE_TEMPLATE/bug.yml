name: Bug report
description: Report a reproducible audio, Host, state, UI, build, or performance defect.
title: "[BUG] "
labels:
  - "type:bug"
body:
  - type: markdown
    attributes:
      value: "Reporter fields come first. Maintainers must complete the ownership contract below before moving the bug to Ready."
  - type: textarea
    id: observed
    attributes:
      label: Observed behavior
      description: Include audible/visible symptoms and whether data or hearing may be harmed.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
      placeholder: "1. Host/project setup\n2. Parameters/routing\n3. Action\n4. Result"
    validations:
      required: true
  - type: input
    id: build
    attributes:
      label: FRAZIL version or commit
      placeholder: commit SHA / artifact name
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Windows, DAW/version, VST3 or Standalone, sample rate, block size, channels, audio device.
    validations:
      required: true
  - type: textarea
    id: state
    attributes:
      label: Parameters and state
      description: Routing, all relevant values, automation, preset/project restore, random seed if reproducible.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Logs, render or project evidence
      description: Attach minimal authorized artifacts; never attach credentials or private sessions.
  - type: dropdown
    id: frequency
    attributes:
      label: Reproduction frequency
      options:
        - Always
        - Often
        - Intermittent
        - Once
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Safety check
      options:
        - label: I checked that attached material contains no credentials or unlicensed/private audio.
          required: true
  - type: input
    id: work_item
    attributes:
      label: Stable ID / Milestone (maintainer triage)
      description: Assign the stable bug/work-item ID and milestone before Ready.
  - type: textarea
    id: ownership
    attributes:
      label: Implementation / Acceptance ownership (maintainer triage)
      placeholder: |
        Implementation DRI:
        Acceptance DRI:
        Write ownership:
  - type: textarea
    id: path_scope
    attributes:
      label: Allowed / Forbidden paths (maintainer triage)
      placeholder: |
        Allowed paths:
        Forbidden paths:
  - type: textarea
    id: handoff
    attributes:
      label: Inputs, outputs, handoff and Joint Gate (maintainer triage)
      placeholder: |
        Inputs owned by Acceptance DRI:
        Outputs owed to Acceptance DRI:
        Handoff condition:
        Joint-gate decisions:
        Related contract / ADR:
