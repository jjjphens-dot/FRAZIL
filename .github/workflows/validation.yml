name: FRAZIL explicit validation

on:
  workflow_dispatch:
    inputs:
      purpose:
        description: Explicit purpose (targeted means existing Fast regression)
        type: choice
        options: [targeted, full, diagnostic, research]
        default: targeted
      module:
        description: One module; Full requires all
        type: choice
        options: [core, water-common, water-a1, water-b1, water-b2, water-d1, water-protect, preview, all]
        default: core
      configuration:
        description: One configuration (D1 research requires release)
        type: choice
        options: [debug, release, asan]
        default: debug
      diagnostic_test:
        description: Diagnostic only; testdata requires core, render_cli requires water-common
        type: choice
        options: [none, testdata, render_cli]
        default: none
      failure:
        description: Observed diagnostic failure class
        type: choice
        options: [none, python-process, interpreter, ctest-environment]
        default: none
      hypothesis:
        description: Concrete diagnostic hypothesis; otherwise leave empty
        type: string
        default: ''
      timeout_seconds:
        description: Per diagnostic case deadline (1..600 seconds; at most four cases)
        type: number
        default: 120
      study:
        description: Research only; one D1 study
        type: choice
        options: [none, latency, convergence]
        default: none

permissions:
  contents: read

# Serialize explicit runs on the same ref, independently of daily PR cancellation.
# Keep the running request; GitHub's default queue replaces an older pending request.
concurrency:
  group: frazil-explicit-${{ github.ref }}
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      purpose: ${{ steps.plan.outputs.purpose }}
      configure_preset: ${{ steps.plan.outputs.configure_preset }}
      build_preset: ${{ steps.plan.outputs.build_preset }}
      build_target: ${{ steps.plan.outputs.build_target }}
      test_preset: ${{ steps.plan.outputs.test_preset }}
      test_label: ${{ steps.plan.outputs.test_label }}
      water: ${{ steps.plan.outputs.water }}
      research_dependencies: ${{ steps.plan.outputs.research_dependencies }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate request and print its bounded execution plan
        id: plan
        shell: bash
        env:
          PURPOSE: ${{ inputs.purpose }}
          MODULE: ${{ inputs.module }}
          CONFIGURATION: ${{ inputs.configuration }}
          DIAGNOSTIC_TEST: ${{ inputs.diagnostic_test }}
          FAILURE: ${{ inputs.failure }}
          HYPOTHESIS: ${{ inputs.hypothesis }}
          CASE_TIMEOUT: ${{ inputs.timeout_seconds }}
          STUDY: ${{ inputs.study }}
        run: |
          python tools/plan_validation.py --context dispatch --purpose "$PURPOSE" \
            --module "$MODULE" --configuration "$CONFIGURATION" \
            --diagnostic-test "$DIAGNOSTIC_TEST" --failure "$FAILURE" \
            --hypothesis "$HYPOTHESIS" --timeout-seconds "$CASE_TIMEOUT" \
            --study "$STUDY" --head "$GITHUB_SHA" --github-output "$GITHUB_OUTPUT" | tee validation-plan.json
      - uses: actions/upload-artifact@v4
        with:
          name: validation-plan-${{ github.run_id }}
          path: validation-plan.json

  selected-validation:
    needs: plan
    if: ${{ success() && !cancelled() && needs.plan.outputs.purpose != 'research' }}
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      CONFIGURE_PRESET: ${{ needs.plan.outputs.configure_preset }}
      BUILD_PRESET: ${{ needs.plan.outputs.build_preset }}
      BUILD_TARGET: ${{ needs.plan.outputs.build_target }}
      TEST_PRESET: ${{ needs.plan.outputs.test_preset }}
      TEST_LABEL: ${{ needs.plan.outputs.test_label }}
      PURPOSE: ${{ needs.plan.outputs.purpose }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - uses: actions/cache@v4
        with:
          path: external/JUCE
          key: juce-9.0.1-e18f7f506c0b96f2c738a0bcd7fe6467a5005ad8-${{ runner.os }}
      - name: Restore pinned dependencies
        shell: pwsh
        run: ./tools/bootstrap_dependencies.ps1
      - name: Install only selected research dependencies
        if: ${{ needs.plan.outputs.research_dependencies == 'true' }}
        run: python -m pip install -r requirements-dsp.txt
      - name: Configure the requested scope
        shell: pwsh
        env:
          WATER: ${{ needs.plan.outputs.water }}
          MODULE: ${{ inputs.module }}
        run: |
          $ciPython = python -c "import sys; print(sys.executable)"
          $water = if ($env:WATER -eq 'true') { 'ON' } else { 'OFF' }
          $preview = if ($env:MODULE -in @('all', 'preview')) { 'ON' } else { 'OFF' }
          cmake --preset $env:CONFIGURE_PRESET "-DFRAZIL_BUILD_WATER_EXPERIMENT=$water" "-DFRAZIL_BUILD_WATER_PREVIEW=$preview" "-DPython3_EXECUTABLE:FILEPATH=$ciPython"
          exit $LASTEXITCODE
      - name: Safe build of selected targets only
        if: ${{ success() && !cancelled() && needs.plan.outputs.build_preset != '' }}
        shell: pwsh
        run: |
          $buildArgs = @('--preset', $env:BUILD_PRESET)
          if ($env:BUILD_TARGET) { $buildArgs += @('--target', $env:BUILD_TARGET) }
          python tools/build_safe.py @buildArgs
          exit $LASTEXITCODE
      - name: Run the selected regression or explicit Full once
        if: ${{ success() && !cancelled() && needs.plan.outputs.purpose != 'diagnostic' }}
        shell: pwsh
        run: |
          $testArgs = @('--preset', $env:TEST_PRESET, '--no-tests=error', '--output-junit', 'selected.xml')
          if ($env:TEST_LABEL) { $testArgs += @('-L', $env:TEST_LABEL) }
          ctest @testArgs
          $testExit = $LASTEXITCODE
          Copy-Item "build/$env:CONFIGURE_PRESET/Testing/Temporary/LastTest.log" "build/$env:CONFIGURE_PRESET/first-run.log"
          exit $testExit
      - name: Diagnose only the explicitly selected Python failure
        if: ${{ success() && !cancelled() && needs.plan.outputs.purpose == 'diagnostic' }}
        shell: pwsh
        env:
          DIAGNOSTIC_TEST: ${{ inputs.diagnostic_test }}
          FAILURE: ${{ inputs.failure }}
          HYPOTHESIS: ${{ inputs.hypothesis }}
          CASE_TIMEOUT: ${{ inputs.timeout_seconds }}
        run: |
          python tools/python_test_ab.py --preset $env:TEST_PRESET --test $env:DIAGNOSTIC_TEST --failure $env:FAILURE --hypothesis $env:HYPOTHESIS --timeout-seconds $env:CASE_TIMEOUT --max-cases 4 --output "build/diagnostic-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          exit $LASTEXITCODE
      - name: Preserve first-run logs including cancellation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selected-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/${{ needs.plan.outputs.configure_preset }}/*.xml
            build/${{ needs.plan.outputs.configure_preset }}/first-run.log
            build/${{ needs.plan.outputs.configure_preset }}/Testing/Temporary/*.log
            build/diagnostic-*/
            build/convergence-events-*/*.log
            build/convergence-events-*/*.json*
            build/safe-build/*.log
  d1-study:
    name: Optional D1 numerical and native resource study
    if: ${{ success() && !cancelled() && needs.plan.outputs.purpose == 'research' }}
    needs: plan
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      FRAZIL_D1_STUDY_ROOT: ${{ inputs.study == 'convergence' && 'build/flow-d1-convergence' || 'build/flow-d1-latency' }}
      OPENBLAS_NUM_THREADS: '1'
      PYTHONFAULTHANDLER: '1'
      PYTHONNOUSERSITE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # Match the failing local baseline for an independent-machine comparison.
          # This pin is diagnostic, not a new project-wide Python requirement.
          python-version: '3.12.4'
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Cache pinned JUCE checkout
        uses: actions/cache@v4
        with:
          path: external/JUCE
          key: juce-9.0.1-e18f7f506c0b96f2c738a0bcd7fe6467a5005ad8-${{ runner.os }}
      - name: Prepare controlled diagnostic environment
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force $env:FRAZIL_D1_STUDY_ROOT | Out-Null
          ./tools/bootstrap_dependencies.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $studyPython = python -c "import sys; print(sys.executable)"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "FRAZIL_D1_PYTHON=$studyPython" >> $env:GITHUB_ENV
          & $studyPython -m pip install -r requirements-dsp.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "Commit: $env:GITHUB_SHA" > $env:FRAZIL_D1_STUDY_ROOT/provenance.txt
          & $studyPython -c "import sys,numpy,scipy; print(sys.version); print(numpy.__version__,scipy.__version__)" >> $env:FRAZIL_D1_STUDY_ROOT/provenance.txt
          Get-CimInstance Win32_Processor | Select-Object Name,NumberOfCores,NumberOfLogicalProcessors | Format-List >> $env:FRAZIL_D1_STUDY_ROOT/provenance.txt
          cmake --preset windows-release -DFRAZIL_BUILD_WATER_EXPERIMENT=ON -DFRAZIL_BUILD_WATER_PREVIEW=OFF "-DPython3_EXECUTABLE:FILEPATH=$studyPython"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Safe build of the selected study helpers
        run: python tools/build_safe.py --preset windows-release-fast --target frazil_water_d1_research_tests
      - name: Generate synthetic native sources and complete numerical screen
        shell: pwsh
        run: |
          & build/windows-release/experiments/water/SPIKE-W-DSP-001/frazil_water_flow_d1_source_probe.exe $env:FRAZIL_D1_STUDY_ROOT/sources
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $script = if ("${{ inputs.study == 'convergence' }}" -eq "true") { 'flow_d1_convergence_study.py' } else { 'flow_d1_latency_study.py' }
          & $env:FRAZIL_D1_PYTHON "experiments/water/SPIKE-W-DSP-001/render/$script" --sources $env:FRAZIL_D1_STUDY_ROOT/sources --output $env:FRAZIL_D1_STUDY_ROOT/study > $env:FRAZIL_D1_STUDY_ROOT/study.log 2>&1
          $studyExit = $LASTEXITCODE
          Get-Content $env:FRAZIL_D1_STUDY_ROOT/study.log -Tail 30
          exit $studyExit
      - name: Measure all minimum-guard native combinations
        shell: pwsh
        run: |
          if ("${{ inputs.study == 'convergence' }}" -eq "true") {
            & $env:FRAZIL_D1_PYTHON experiments/water/SPIKE-W-DSP-001/render/flow_d1_convergence_native.py --native build/windows-release/experiments/water/SPIKE-W-DSP-001/frazil_water_flow_d1_latency_native.exe --sources $env:FRAZIL_D1_STUDY_ROOT/sources --study $env:FRAZIL_D1_STUDY_ROOT/study --output $env:FRAZIL_D1_STUDY_ROOT/native > $env:FRAZIL_D1_STUDY_ROOT/native.log 2>&1
          } else {
            & $env:FRAZIL_D1_PYTHON experiments/water/SPIKE-W-DSP-001/render/flow_d1_latency_native_study.py --native build/windows-release/experiments/water/SPIKE-W-DSP-001/frazil_water_flow_d1_latency_native.exe --sources $env:FRAZIL_D1_STUDY_ROOT/sources --selection $env:FRAZIL_D1_STUDY_ROOT/study/SELECTION.csv --output $env:FRAZIL_D1_STUDY_ROOT/native > $env:FRAZIL_D1_STUDY_ROOT/native.log 2>&1
          }
          $studyExit = $LASTEXITCODE
          Get-Content $env:FRAZIL_D1_STUDY_ROOT/native.log -Tail 30
          exit $studyExit
      - name: Cross-rate and event diagnostics
        if: ${{ inputs.study == 'convergence' }}
        shell: pwsh
        run: |
          & $env:FRAZIL_D1_PYTHON experiments/water/SPIKE-W-DSP-001/render/flow_d1_convergence_cross_rate.py --sources $env:FRAZIL_D1_STUDY_ROOT/sources --study $env:FRAZIL_D1_STUDY_ROOT/study --output $env:FRAZIL_D1_STUDY_ROOT/cross-rate > $env:FRAZIL_D1_STUDY_ROOT/cross-rate.log 2>&1
          $studyExit = $LASTEXITCODE
          Get-Content $env:FRAZIL_D1_STUDY_ROOT/cross-rate.log -Tail 30
          exit $studyExit
      - name: Preserve summary evidence and failure logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.study == 'convergence' && 'flow-d1-convergence' || 'flow-d1-latency' }}-${{ github.sha }}
          retention-days: 30
          path: |
            ${{ env.FRAZIL_D1_STUDY_ROOT }}/provenance.txt
            ${{ env.FRAZIL_D1_STUDY_ROOT }}/*.log
            ${{ env.FRAZIL_D1_STUDY_ROOT }}/sources/authority.json
            ${{ env.FRAZIL_D1_STUDY_ROOT }}/study/*.csv
            ${{ env.FRAZIL_D1_STUDY_ROOT }}/study/report.json
            ${{ env.FRAZIL_D1_STUDY_ROOT }}/native/NATIVE.csv
            ${{ env.FRAZIL_D1_STUDY_ROOT }}/native/RESOURCES.csv
            build/safe-build/windows-release-fast.log
            ${{ env.FRAZIL_D1_STUDY_ROOT }}/cross-rate/*.csv
            ${{ env.FRAZIL_D1_STUDY_ROOT }}/sources/*-events.csv
