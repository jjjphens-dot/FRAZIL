name: FRAZIL CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-debug:
    name: Windows Debug / CMake / CTest
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Check repository portability
        shell: pwsh
        run: python tools/check_portability.py

      - name: Test repository portability scanner
        shell: pwsh
        run: python tools/test_check_portability.py

      - name: Check Markdown internal links
        shell: pwsh
        run: python tools/check_markdown_links.py

      - name: Test Markdown internal-link scanner
        shell: pwsh
        run: python tools/test_check_markdown_links.py

      - name: Check VS Code task references
        shell: pwsh
        run: python tools/check_vscode_tasks.py

      - name: Test VS Code task reference checker
        shell: pwsh
        run: python tools/test_check_vscode_tasks.py

      - name: Test build safety wrapper
        shell: pwsh
        run: python tools/test_build_safe.py

      - name: Verify reference input corpus
        shell: pwsh
        run: python tools/verify_testdata.py

      - name: Test reference input corpus verifier
        shell: pwsh
        run: python tools/test_testdata.py

      - name: Enable MSVC developer environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Cache pinned JUCE checkout
        uses: actions/cache@v4
        with:
          path: external/JUCE
          key: juce-9.0.1-e18f7f506c0b96f2c738a0bcd7fe6467a5005ad8-${{ runner.os }}

      - name: Restore pinned dependencies
        shell: pwsh
        run: ./tools/bootstrap_dependencies.ps1

      - name: Install DSP experiment analysis dependencies
        shell: pwsh
        run: |
          $ciPython = python -c "import sys; print(sys.executable)"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $ciPython -c "import sys; print('Dependency interpreter:', sys.executable); print(sys.version)"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $ciPython -m pip install -r requirements-dsp.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "FRAZIL_CI_PYTHON=$ciPython" >> $env:GITHUB_ENV

      - name: Configure
        shell: pwsh
        run: |
          # Bind CMake to the interpreter that owns the installed dependencies, not a second discovery.
          cmake --preset ci-windows-debug -DFRAZIL_BUILD_WATER_EXPERIMENT=ON -DFRAZIL_BUILD_WATER_PREVIEW=ON "-DPython3_EXECUTABLE:FILEPATH=$env:FRAZIL_CI_PYTHON"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $cacheEntry = Select-String -Path build/ci-windows-debug/CMakeCache.txt -Pattern '^Python3_EXECUTABLE:FILEPATH='
          $cmakePython = ($cacheEntry.Line -split '=', 2)[1]
          $testJson = ctest --preset ci-windows-debug -R '^frazil_water_protect_listening$' --show-only=json-v1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $listeningTests = @((($testJson -join "`n") | ConvertFrom-Json).tests)
          if ($listeningTests.Count -ne 1) { throw 'Protect listening test must remain registered' }
          $ctestPython = $listeningTests[0].command[0]
          foreach ($actual in @($cmakePython, $ctestPython)) {
            if (!$actual -or [IO.Path]::GetFullPath($actual) -ine [IO.Path]::GetFullPath($env:FRAZIL_CI_PYTHON)) {
              throw "Python interpreter mismatch: expected $env:FRAZIL_CI_PYTHON, got $actual"
            }
          }
          Write-Host "Python identity PASS: pip=$env:FRAZIL_CI_PYTHON; CMake=$cmakePython; CTest=$ctestPython"

      - name: Build
        run: python tools/build_safe.py --preset ci-windows-debug

      - name: Test
        run: ctest --preset ci-windows-debug
