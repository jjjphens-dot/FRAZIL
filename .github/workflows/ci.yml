name: FRAZIL CI

on:
  push:
    branches: [ main ]
  pull_request:
concurrency:
  group: frazil-fast-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  impact:
    runs-on: ubuntu-latest
    outputs:
      active_modules: ${{ steps.route.outputs.active_modules }}
      build_required: ${{ steps.route.outputs.build_required }}
      test_required: ${{ steps.route.outputs.test_required }}
      core_required: ${{ steps.route.outputs.core_required }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Select affected test modules
        id: route
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            echo "Missing comparison base; refusing an unscoped plan" >&2
            exit 1
          else
            python tools/plan_validation.py --context pr --stage test --base "$BASE" --head "$HEAD" --github-output "$GITHUB_OUTPUT"
          fi

  ci-core:
    name: Repository policy checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Lightweight policy and routing regressions
        shell: pwsh
        run: |
          foreach ($script in @('check_portability', 'test_check_portability', 'check_markdown_links',
              'test_check_markdown_links', 'check_vscode_tasks', 'test_check_vscode_tasks',
              'test_build_safe', 'test_check_test_paths', 'test_test_impact', 'test_performance_observation',
              'test_plan_validation', 'test_python_test_ab', 'test_validation_workflow', 'test_current_modules')) {
            python "tools/$script.py"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          python tools/generate_current_presets.py --check

  ci-build-current:
    needs: [impact, ci-core]
    if: ${{ needs.impact.outputs.build_required == 'true' }}
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      MODULES: ${{ needs.impact.outputs.active_modules }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - uses: actions/cache@v4
        with:
          path: external/JUCE
          key: juce-9.0.1-e18f7f506c0b96f2c738a0bcd7fe6467a5005ad8-${{ runner.os }}
      - name: Restore pinned dependencies
        shell: pwsh
        run: ./tools/bootstrap_dependencies.ps1
      - name: Configure isolated scope
        shell: pwsh
        run: |
          $ciPython = python -c "import sys; print(sys.executable)"
          cmake --preset ci-windows-debug "-DPython3_EXECUTABLE:FILEPATH=$ciPython"
          exit $LASTEXITCODE
      - name: Stage 1 - production Build Gate
        shell: pwsh
        run: |
          python tools/build_safe.py --preset ci-windows-debug-build
          exit $LASTEXITCODE
      - name: Stage 2 - selected CURRENT Test Stage
        if: ${{ success() && !cancelled() && needs.impact.outputs.test_required == 'true' && needs.impact.outputs.active_modules != '[]' }}
        shell: pwsh
        run: |
          python tools/check_current_tests.py --preset ci-windows-debug
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $selected = ($env:MODULES | ConvertFrom-Json) -join ","
          python tools/run_current_tests.py --preset ci-windows-debug --modules $selected --execute
          exit $LASTEXITCODE
      - name: Preserve first-run evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-build-current-${{ github.sha }}
          path: |
            build/ci-windows-debug/*.xml
            build/ci-windows-debug/Testing/Temporary/*.log
            build/safe-build/*.log

  ci-host-tests:
    needs: [impact, ci-build-current]
    if: ${{ needs.impact.outputs.test_required == 'true' && needs.impact.outputs.core_required == 'true' }}
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      MODULES: ${{ needs.impact.outputs.active_modules }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - uses: actions/cache@v4
        with:
          path: external/JUCE
          key: juce-9.0.1-e18f7f506c0b96f2c738a0bcd7fe6467a5005ad8-${{ runner.os }}
      - name: Restore pinned dependencies
        shell: pwsh
        run: ./tools/bootstrap_dependencies.ps1
      - name: Configure isolated scope
        shell: pwsh
        run: |
          $ciPython = python -c "import sys; print(sys.executable)"
          cmake --preset ci-windows-debug-host "-DPython3_EXECUTABLE:FILEPATH=$ciPython"
          exit $LASTEXITCODE
      - name: Run separate Test Stage once
        shell: pwsh
        run: |
          python tools/build_safe.py --preset ci-windows-debug-core
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ctest --preset ci-windows-debug-core --no-tests=error --output-junit host.xml
          exit $LASTEXITCODE
      - name: Preserve first-run evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-host-tests-${{ github.sha }}
          path: |
            build/ci-windows-debug-host/*.xml
            build/ci-windows-debug-host/Testing/Temporary/*.log
            build/safe-build/*.log
