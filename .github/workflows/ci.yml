name: FRAZIL CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:
    inputs:
      full_validation:
        description: Run complete Debug, Release and ASAN validation serially
        type: boolean
        required: false
        default: false
      flow_d1_latency:
        description: Run the full synthetic D1 latency study on an independent Release runner
        type: boolean
        required: false
        default: false

      flow_d1_convergence:
        description: Run the bounded FD-003 shortlist and cross-rate study
        type: boolean
        required: false
        default: false

permissions:
  contents: read

jobs:
  impact:
    runs-on: ubuntu-latest
    outputs:
      modules: ${{ steps.route.outputs.modules }}
      water: ${{ steps.route.outputs.water }}
      testdata: ${{ steps.route.outputs.testdata }}
      research_dependencies: ${{ steps.route.outputs.research_dependencies }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Select affected test modules
        id: route
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            python tools/test_impact.py --github-output "$GITHUB_OUTPUT" CMakeLists.txt testdata/manifest.json
          else
            python tools/test_impact.py --base "$BASE" --head "$HEAD" --github-output "$GITHUB_OUTPUT"
          fi

  ci-core:
    name: Core build and fast regression
    needs: impact
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - uses: actions/cache@v4
        with:
          path: external/JUCE
          key: juce-9.0.1-e18f7f506c0b96f2c738a0bcd7fe6467a5005ad8-${{ runner.os }}
      - name: Restore pinned dependencies
        shell: pwsh
        run: ./tools/bootstrap_dependencies.ps1
      - name: Repository checks and tooling regressions
        shell: pwsh
        run: |
          foreach ($script in @('check_portability', 'test_check_portability', 'check_markdown_links',
              'test_check_markdown_links', 'check_vscode_tasks', 'test_check_vscode_tasks',
              'test_build_safe', 'test_check_test_paths', 'test_test_impact')) {
            python "tools/$script.py"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Configure core without research dependencies
        shell: pwsh
        run: |
          $ciPython = python -c "import sys; print(sys.executable)"
          cmake --preset ci-windows-debug -DFRAZIL_BUILD_WATER_EXPERIMENT=OFF -DFRAZIL_BUILD_WATER_PREVIEW=OFF "-DPython3_EXECUTABLE:FILEPATH=$ciPython"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/check_test_paths.py --preset ci-windows-debug
      - name: Safe core build
        run: python tools/build_safe.py --preset ci-windows-debug-core
      - name: Core fast including lightweight corpus verification
        run: ctest --preset ci-windows-debug-core --output-junit core.xml
      - name: Deep corpus regeneration on corpus or generator changes
        if: ${{ needs.impact.outputs.testdata == 'true' }}
        run: ctest --preset ci-windows-debug-full -R '^frazil_testdata_regeneration$' --output-junit testdata.xml
      - name: Preserve first-run evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-core-${{ github.sha }}
          path: |
            build/ci-windows-debug/*.xml
            build/ci-windows-debug/Testing/Temporary/*.log
            build/safe-build/*.log

  ci-water-fast:
    name: Affected Water module fast paths
    needs: [impact, ci-core]
    if: ${{ needs.impact.outputs.water == 'true' }}
    runs-on: windows-latest
    env:
      MODULES: ${{ needs.impact.outputs.modules }}
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - uses: actions/cache@v4
        with:
          path: external/JUCE
          key: juce-9.0.1-e18f7f506c0b96f2c738a0bcd7fe6467a5005ad8-${{ runner.os }}
      - name: Restore pinned dependencies
        shell: pwsh
        run: ./tools/bootstrap_dependencies.ps1
      - name: Select one Python interpreter
        shell: pwsh
        run: |
          $ciPython = python -c "import sys; print(sys.executable)"
          "FRAZIL_CI_PYTHON=$ciPython" >> $env:GITHUB_ENV
      - name: Install dependencies only for selected Python audio tests
        if: ${{ needs.impact.outputs.research_dependencies == 'true' }}
        shell: pwsh
        run: '& $env:FRAZIL_CI_PYTHON -m pip install -r requirements-dsp.txt'
      - name: Configure and check all scoped selectors
        shell: pwsh
        run: |
          $preview = if (($env:MODULES | ConvertFrom-Json) -contains 'preview') { 'ON' } else { 'OFF' }
          cmake --preset ci-windows-debug -DFRAZIL_BUILD_WATER_EXPERIMENT=ON "-DFRAZIL_BUILD_WATER_PREVIEW=$preview" "-DPython3_EXECUTABLE:FILEPATH=$env:FRAZIL_CI_PYTHON"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/check_test_paths.py --preset ci-windows-debug
      - name: Build and run affected modules serially
        shell: pwsh
        run: |
          foreach ($module in ($env:MODULES | ConvertFrom-Json)) {
            & $env:FRAZIL_CI_PYTHON tools/build_safe.py --preset "ci-windows-debug-$module"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            ctest --preset "ci-windows-debug-$module" --output-junit "$module.xml"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Preserve first-run evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-water-fast-${{ github.sha }}
          path: |
            build/ci-windows-debug/*.xml
            build/ci-windows-debug/Testing/Temporary/*.log
            build/safe-build/*.log

  validation-full:
    name: Full ${{ matrix.preset }}
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.full_validation }}
    needs: ci-core
    runs-on: windows-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        preset: [windows-debug, windows-release, windows-asan]
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - uses: actions/cache@v4
        with:
          path: external/JUCE
          key: juce-9.0.1-e18f7f506c0b96f2c738a0bcd7fe6467a5005ad8-${{ runner.os }}
      - name: Restore pinned dependencies
        shell: pwsh
        run: ./tools/bootstrap_dependencies.ps1
      - name: Bind full research dependencies to CMake Python
        shell: pwsh
        run: |
          $ciPython = python -c "import sys; print(sys.executable)"
          & $ciPython -m pip install -r requirements-dsp.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --preset ${{ matrix.preset }} -DFRAZIL_BUILD_WATER_EXPERIMENT=ON -DFRAZIL_BUILD_WATER_PREVIEW=ON "-DPython3_EXECUTABLE:FILEPATH=$ciPython"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Safe full build
        run: python tools/build_safe.py --preset ${{ matrix.preset }}-full
      - name: Complete validation including research, listening mechanics and performance
        run: ctest --preset ${{ matrix.preset }}-full --output-junit full.xml
      - name: Preserve first-run evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-${{ matrix.preset }}-${{ github.sha }}
          path: |
            build/${{ matrix.preset }}/*.xml
            build/${{ matrix.preset }}/Testing/Temporary/*.log
            build/safe-build/*.log

  flow-d1-latency:
    name: Optional D1 numerical and native resource study
    if: ${{ github.event_name == 'workflow_dispatch' && (inputs.flow_d1_latency || inputs.flow_d1_convergence) }}
    needs: ci-core
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      FRAZIL_D1_STUDY_ROOT: ${{ inputs.flow_d1_convergence && 'build/flow-d1-convergence' || 'build/flow-d1-latency' }}
      OPENBLAS_NUM_THREADS: '1'
      PYTHONFAULTHANDLER: '1'
      PYTHONNOUSERSITE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # Match the failing local baseline for an independent-machine comparison.
          # This pin is diagnostic, not a new project-wide Python requirement.
          python-version: '3.12.4'
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Cache pinned JUCE checkout
        uses: actions/cache@v4
        with:
          path: external/JUCE
          key: juce-9.0.1-e18f7f506c0b96f2c738a0bcd7fe6467a5005ad8-${{ runner.os }}
      - name: Prepare controlled diagnostic environment
        shell: pwsh
        run: |
          if ("${{ inputs.flow_d1_latency && inputs.flow_d1_convergence }}" -eq "true") { throw 'Choose one D1 study per dispatch' }
          New-Item -ItemType Directory -Force $env:FRAZIL_D1_STUDY_ROOT | Out-Null
          ./tools/bootstrap_dependencies.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $studyPython = python -c "import sys; print(sys.executable)"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "FRAZIL_D1_PYTHON=$studyPython" >> $env:GITHUB_ENV
          & $studyPython -m pip install -r requirements-dsp.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "Commit: $env:GITHUB_SHA" > $env:FRAZIL_D1_STUDY_ROOT/provenance.txt
          & $studyPython -c "import sys,numpy,scipy; print(sys.version); print(numpy.__version__,scipy.__version__)" >> $env:FRAZIL_D1_STUDY_ROOT/provenance.txt
          Get-CimInstance Win32_Processor | Select-Object Name,NumberOfCores,NumberOfLogicalProcessors | Format-List >> $env:FRAZIL_D1_STUDY_ROOT/provenance.txt
          cmake --preset windows-release -DFRAZIL_BUILD_WATER_EXPERIMENT=ON -DFRAZIL_BUILD_WATER_PREVIEW=OFF "-DPython3_EXECUTABLE:FILEPATH=$studyPython"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Safe Release build and full device-free tests
        shell: pwsh
        run: |
          & $env:FRAZIL_D1_PYTHON tools/build_safe.py --preset windows-release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ctest --preset windows-release --output-on-failure > $env:FRAZIL_D1_STUDY_ROOT/ctest.log 2>&1
          if ($LASTEXITCODE -ne 0) {
            Get-Content $env:FRAZIL_D1_STUDY_ROOT/ctest.log -Tail 100
            exit 1
          }
      - name: Generate synthetic native sources and complete numerical screen
        shell: pwsh
        run: |
          & build/windows-release/experiments/water/SPIKE-W-DSP-001/frazil_water_flow_d1_source_probe.exe $env:FRAZIL_D1_STUDY_ROOT/sources
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $script = if ("${{ inputs.flow_d1_convergence }}" -eq "true") { 'flow_d1_convergence_study.py' } else { 'flow_d1_latency_study.py' }
          & $env:FRAZIL_D1_PYTHON "experiments/water/SPIKE-W-DSP-001/render/$script" --sources $env:FRAZIL_D1_STUDY_ROOT/sources --output $env:FRAZIL_D1_STUDY_ROOT/study > $env:FRAZIL_D1_STUDY_ROOT/study.log 2>&1
          $studyExit = $LASTEXITCODE
          Get-Content $env:FRAZIL_D1_STUDY_ROOT/study.log -Tail 30
          exit $studyExit
      - name: Measure all minimum-guard native combinations
        shell: pwsh
        run: |
          if ("${{ inputs.flow_d1_convergence }}" -eq "true") {
            & $env:FRAZIL_D1_PYTHON experiments/water/SPIKE-W-DSP-001/render/flow_d1_convergence_native.py --native build/windows-release/experiments/water/SPIKE-W-DSP-001/frazil_water_flow_d1_latency_native.exe --sources $env:FRAZIL_D1_STUDY_ROOT/sources --study $env:FRAZIL_D1_STUDY_ROOT/study --output $env:FRAZIL_D1_STUDY_ROOT/native > $env:FRAZIL_D1_STUDY_ROOT/native.log 2>&1
          } else {
            & $env:FRAZIL_D1_PYTHON experiments/water/SPIKE-W-DSP-001/render/flow_d1_latency_native_study.py --native build/windows-release/experiments/water/SPIKE-W-DSP-001/frazil_water_flow_d1_latency_native.exe --sources $env:FRAZIL_D1_STUDY_ROOT/sources --selection $env:FRAZIL_D1_STUDY_ROOT/study/SELECTION.csv --output $env:FRAZIL_D1_STUDY_ROOT/native > $env:FRAZIL_D1_STUDY_ROOT/native.log 2>&1
          }
          $studyExit = $LASTEXITCODE
          Get-Content $env:FRAZIL_D1_STUDY_ROOT/native.log -Tail 30
          exit $studyExit
      - name: Cross-rate and event diagnostics
        if: ${{ inputs.flow_d1_convergence }}
        shell: pwsh
        run: |
          & $env:FRAZIL_D1_PYTHON experiments/water/SPIKE-W-DSP-001/render/flow_d1_convergence_cross_rate.py --sources $env:FRAZIL_D1_STUDY_ROOT/sources --study $env:FRAZIL_D1_STUDY_ROOT/study --output $env:FRAZIL_D1_STUDY_ROOT/cross-rate > $env:FRAZIL_D1_STUDY_ROOT/cross-rate.log 2>&1
          $studyExit = $LASTEXITCODE
          Get-Content $env:FRAZIL_D1_STUDY_ROOT/cross-rate.log -Tail 30
          exit $studyExit
      - name: Preserve summary evidence and failure logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.flow_d1_convergence && 'flow-d1-convergence' || 'flow-d1-latency' }}-${{ github.sha }}
          retention-days: 30
          path: |
            ${{ env.FRAZIL_D1_STUDY_ROOT }}/provenance.txt
            ${{ env.FRAZIL_D1_STUDY_ROOT }}/*.log
            ${{ env.FRAZIL_D1_STUDY_ROOT }}/sources/authority.json
            ${{ env.FRAZIL_D1_STUDY_ROOT }}/study/*.csv
            ${{ env.FRAZIL_D1_STUDY_ROOT }}/study/report.json
            ${{ env.FRAZIL_D1_STUDY_ROOT }}/native/NATIVE.csv
            ${{ env.FRAZIL_D1_STUDY_ROOT }}/native/RESOURCES.csv
            build/safe-build/windows-release.log
            ${{ env.FRAZIL_D1_STUDY_ROOT }}/cross-rate/*.csv
            ${{ env.FRAZIL_D1_STUDY_ROOT }}/sources/*-events.csv
